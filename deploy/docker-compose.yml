services:
  traefik:
    image: traefik:v3
    container_name: traefik-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - ksi-network
    ports:
      - '80:80'
      - '443:443'
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json
        #- /etc/letsencrypt/live/ksi.ii.uni.wroc.pl/fullchain.pem:/certs/fullchain.pem:ro
        # - /etc/letsencrypt/live/ksi.ii.uni.wroc.pl/privkey.pem:/certs/privkey.pem:ro
        #      - ./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
    command:
      # Provider Settings
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      # Entrypoints & HTTP to HTTPS Redirection
      #      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
      - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
      - '--entrypoints.websecure.address=:443'

      - '--certificatesresolvers.letsencrypt.acme.email=root@crqch.dev'
      - '--certificatesresolvers.letsencrypt.acme.storage=/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
    labels:
      - 'traefik.enable=true'
      # Secure Traefik Dashboard (Optional - replace with your credentials)
      - 'traefik.http.routers.dashboard.rule=Host(`ksi.ii.uni.wroc.pl`) && PathPrefix(`/traefik`)'
      - 'traefik.http.routers.dashboard.service=api@internal'
      - 'traefik.http.routers.dashboard.entrypoints=websecure'
      - 'traefik.http.routers.dashboard.tls.certresolver=letsencrypt'

  postgres:
    image: postgres:13-alpine
    container_name: ksi-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ksi
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=passdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
        #network_mode: host
    networks:
      - ksi-network

  backend:
    image: 'ghcr.io/ksiuwr/ksi-backend:latest'
    container_name: ksi-backend-prod
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - ksi-network
    depends_on:
      - postgres
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.backend.rule=Host(`ksi.ii.uni.wroc.pl`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.backend.entrypoints=websecure'
      - 'traefik.http.routers.backend.tls.certresolver=letsencrypt'
        #- "traefik.http.routers.backend.tls=true"
      - 'traefik.http.routers.backend.priority=10'
      # Define middlewares locally to this service
      #- "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - 'traefik.http.middlewares.backend-gzip.compress=true'
        #- "traefik.http.routers.backend.middlewares=api-strip,backend-gzip"
      - 'traefik.http.routers.backend.middlewares=backend-gzip'
      - 'traefik.http.services.backend.loadbalancer.server.port=3000'

  frontend:
    image: 'ghcr.io/ksiuwr/ksi-frontend:latest'
    container_name: ksi-frontend-prod
    restart: unless-stopped
    networks:
      - ksi-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.frontend.rule=Host(`ksi.ii.uni.wroc.pl`) && PathPrefix(`/`)'
      - 'traefik.http.routers.frontend.entrypoints=websecure'
        #- "traefik.http.routers.frontend.tls=true"
      - 'traefik.http.routers.frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.frontend.priority=1'
      - 'traefik.http.middlewares.frontend-gzip.compress=true'
      - 'traefik.http.routers.frontend.middlewares=frontend-gzip'
      - 'traefik.http.services.frontend.loadbalancer.server.port=3001'
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300 # Checks for updates every 5 minutes (300s)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # This allows Watchtower to use your 'docker login' credentials for GHCR
      - $HOME/.docker/config.json:/config.json:ro
    #           # We restrict it to only watch specific containers to save resources
    command: ksi-backend-prod ksi-frontend-prod
networks:
  ksi-network:
    driver: bridge

volumes:
  postgres-data:
