name: Platform CI and production promotion
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: ksi_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ksi_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:integration@127.0.0.1:5432/ksi_integration
      KSI_ENVIRONMENT: integration
      PROXY_SECRET: integration-proxy-secret
      BETTER_AUTH_SECRET: integration-auth-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run test
      - run: bun run db:migrate
      - run: bun run test:integration
      - run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py'
      - run: bun run --cwd apps/server check
      - run: bun run check
      - run: bun run build
  images:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, web, auth, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/deployment/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            PUBLIC_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Record immutable digest
        env:
          APP: ${{ matrix.app }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('image.json').write_text(json.dumps({os.environ['APP']: 'ghcr.io/' + os.environ['REPOSITORY'] + '-' + os.environ['APP'] + '@' + os.environ['DIGEST']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: image.json
  promote:
    needs: [checks, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ksi-cluster-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: ksiuwr/ksi-cluster
          token: ${{ secrets.CLUSTER_WRITE_TOKEN }}
          path: cluster
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
      - name: Update production manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          images = {}
          for path in Path('images').glob('*/image.json'):
              images.update(json.loads(path.read_text()))
          Path('images.json').write_text(json.dumps(images))
          PY
          python3 core/scripts/deployment/promote_manifest.py \
            --manifest cluster/production-platform.yaml \
            --images images.json
      - name: Reject stale runs and commit promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          encoded=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe=""))')
          current=$(gh api "repos/$REPOSITORY/branches/$encoded" --jq .commit.sha)
          test "$current" = "$COMMIT" || { echo 'Stale build: branch advanced; refusing promotion'; exit 1; }
          git -C cluster config user.name ksi-deployment
          git -C cluster config user.email deployment@ksi.edu.pl
          git -C cluster add production-platform.yaml
          if ! git -C cluster diff --cached --quiet; then
            git -C cluster commit -m "Deploy tested $COMMIT"
            git -C cluster push
          fi
